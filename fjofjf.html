<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スラモン攻略メモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1330;
    --bg-alt: #241a3d;
    --panel: #2a2049;
    --panel-border: #4a3b7a;
    --accent-green: #8ce071;
    --accent-pink: #ff6fa5;
    --accent-gold: #ffc857;
    --text: #f5f1ff;
    --text-muted: #b8aedc;
    --radius: 18px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: radial-gradient(circle at top left, var(--bg-alt), var(--bg) 60%);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    line-height: 1.7;
  }

  h1, h2, h3, .brand-icon, .nav-pills a, .panel-icon {
    font-family: 'M PLUS Rounded 1c', sans-serif;
  }

  a {
    color: inherit;
  }

  .site-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(27, 19, 48, 0.92);
    backdrop-filter: blur(6px);
    border-bottom: 2px solid var(--panel-border);
  }

  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-icon {
    font-size: 32px;
  }

  .brand h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
  }

  .tagline {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--text-muted);
  }

  .nav-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .nav-pills a {
    text-decoration: none;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    transition: background 0.15s, transform 0.15s;
  }

  .nav-pills a:hover,
  .nav-pills a:focus-visible {
    background: var(--accent-green);
    color: #1b1330;
    transform: translateY(-1px);
  }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .window-panel {
    background: var(--panel);
    border: 2px solid var(--panel-border);
    border-radius: var(--radius);
    box-shadow: 0 0 0 4px rgba(74, 59, 122, 0.25), 0 12px 30px rgba(0, 0, 0, 0.35);
    overflow: hidden;
    scroll-margin-top: 90px;
  }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    background: linear-gradient(90deg, rgba(140, 224, 113, 0.15), transparent);
    border-bottom: 2px dashed var(--panel-border);
  }

  .panel-icon {
    font-size: 22px;
  }

  .panel-header h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.02em;
  }

  .panel-body {
    padding: 18px 20px 22px;
  }

  .sub-heading {
    font-size: 14px;
    color: var(--accent-gold);
    margin: 18px 0 10px;
    font-weight: 700;
  }

  .sub-heading:first-of-type {
    margin-top: 0;
  }

  .search-box {
    width: 100%;
    padding: 10px 16px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    background: var(--bg-alt);
    color: var(--text);
    font-size: 14px;
    margin-bottom: 16px;
  }

  .search-box::placeholder {
    color: var(--text-muted);
  }

  .search-box:focus-visible {
    outline: 2px solid var(--accent-green);
    outline-offset: 2px;
  }

  .event-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .event-card {
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 12px 16px;
    background: var(--bg-alt);
  }

  .event-card h3 {
    margin: 0 0 8px;
    font-size: 15px;
    color: var(--accent-pink);
  }

  .choice-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 0;
    border-top: 1px dashed rgba(184, 174, 220, 0.25);
    font-size: 13px;
  }

  .choice-row:first-of-type {
    border-top: none;
  }

  .choice-reward {
    color: var(--accent-gold);
    text-align: right;
    white-space: nowrap;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }

  .data-card {
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 12px 14px;
    background: var(--bg-alt);
  }

  .data-card .card-name {
    font-weight: 700;
    color: var(--accent-green);
    font-size: 14px;
    margin: 0 0 6px;
  }

  .data-card .card-effect {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0;
  }

  .level-table {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .level-row {
    display: grid;
    grid-template-columns: 60px 1fr 1fr;
    gap: 10px;
    align-items: start;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 14px;
    background: var(--bg-alt);
    font-size: 13px;
  }

  .level-row .lv-badge {
    font-weight: 800;
    color: var(--accent-pink);
  }

  .level-row .lv-label {
    font-size: 11px;
    color: var(--text-muted);
    display: block;
    margin-bottom: 2px;
  }

  .status-note {
    border: 1px dashed var(--accent-gold);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--accent-gold);
    font-size: 13px;
    background: rgba(255, 200, 87, 0.08);
  }

  .lead-text {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 14px;
  }

  .empty-note {
    color: var(--text-muted);
    font-size: 13px;
  }

  .site-footer {
    text-align: center;
    padding: 20px;
    color: var(--text-muted);
    font-size: 12px;
    border-top: 1px solid var(--panel-border);
  }

  @media (max-width: 600px) {
    .header-inner {
      flex-direction: column;
      align-items: flex-start;
    }

    .nav-pills {
      width: 100%;
    }

    .level-row {
      grid-template-columns: 1fr;
    }

    .choice-row {
      flex-direction: column;
    }

    .choice-reward {
      text-align: left;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
    }
  }
</style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon">🟢</span>
        <div>
          <h1>スラモン攻略メモ</h1>
          <p class="tagline">Mirrativ「スラモン」非公式まとめ</p>
        </div>
      </div>
      <nav class="nav-pills">
        <a href="#events">🎲 選択肢</a>
        <a href="#items">🎒 アイテム</a>
        <a href="#training">💪 トレーニング/あそぶ</a>
        <a href="#blessing">✨ 加護Lv</a>
        <a href="#skills">⚔️ スキル</a>
        <a href="#rewardlv">🎁 ごほうびLv</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="events" class="window-panel">
      <div class="panel-header"><span class="panel-icon">🎲</span><h2>イベント選択肢と報酬</h2></div>
      <div class="panel-body">
        <input type="search" id="eventSearch" class="search-box" placeholder="選択肢・報酬・イベント名で検索…">
        <p id="eventEmpty" class="empty-note" hidden>一致する選択肢が見つかりませんでした。</p>
        <div id="eventList" class="event-list"></div>
      </div>
    </section>

    <section id="items" class="window-panel">
      <div class="panel-header"><span class="panel-icon">🎒</span><h2>アイテムの効果</h2></div>
      <div class="panel-body">
        <div id="itemGrid" class="card-grid"></div>
      </div>
    </section>

    <section id="training" class="window-panel">
      <div class="panel-header"><span class="panel-icon">💪</span><h2>トレーニング / あそぶ の効果</h2></div>
      <div class="panel-body">
        <h3 class="sub-heading">トレーニング</h3>
        <p id="trainingStatus" class="status-note"></p>
        <h3 class="sub-heading">あそぶ</h3>
        <div id="playGrid" class="card-grid"></div>
      </div>
    </section>

    <section id="blessing" class="window-panel">
      <div class="panel-header"><span class="panel-icon">✨</span><h2>加護Lv</h2></div>
      <div class="panel-body">
        <p id="blessingDesc" class="lead-text"></p>
        <div id="blessingTable" class="level-table"></div>
      </div>
    </section>

    <section id="skills" class="window-panel">
      <div class="panel-header"><span class="panel-icon">⚔️</span><h2>スキル効果</h2></div>
      <div class="panel-body">
        <h3 class="sub-heading">バトルスキル</h3>
        <div id="battleSkillGrid" class="card-grid"></div>
        <h3 class="sub-heading">パッシブスキル</h3>
        <div id="passiveSkillGrid" class="card-grid"></div>
      </div>
    </section>

    <section id="rewardlv" class="window-panel">
      <div class="panel-header"><span class="panel-icon">🎁</span><h2>ごほうびLv</h2></div>
      <div class="panel-body">
        <p id="rewardLvStatus" class="status-note"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>個人の攻略メモを公開している非公式ファンサイトです。最終更新: <span id="lastUpdated"></span></p>
  </footer>

  <script>
    // ==========================================================
    // ここから下のデータを編集するだけでサイトが更新されます。
    // サンプルの内容（例）は消して、実際の攻略メモに置き換えてください。
    // ==========================================================

    const eventData = [
      {
        event: "（例）森のわかれ道",
        choices: [
          { text: "左の道を進む", reward: "けいけんち+10、アイテム『木の実』" },
          { text: "右の道を進む", reward: "スラコイン+50" },
        ],
      },
      {
        event: "（例）あやしい商人",
        choices: [
          { text: "話しかける", reward: "レアアイテム入手のチャンス" },
          { text: "無視する", reward: "特になし" },
        ],
      },
    ];

    const itemData = [
      { name: "（例）げんきの実", effect: "HPを20回復する" },
      { name: "（例）スラコイン袋", effect: "スラコインを100獲得する" },
    ];

    const playData = [
      { name: "（例）なでる", effect: "なつき度が+5される" },
      { name: "（例）話しかける", effect: "なつき度が+3される" },
    ];

    const trainingInfo = {
      note: "情報を集めています。わかり次第このセクションに追加します。",
    };

    const blessingInfo = {
      description: "（例）加護は一定の条件を満たすと解放される特別な強化効果です。内容はサンプルのため、実際の情報に置き換えてください。",
      levels: [
        { level: 1, effect: "攻撃力+5%", condition: "初期状態で解放" },
        { level: 2, effect: "攻撃力+10%", condition: "累計ログイン7日" },
      ],
    };

    const battleSkillData = [
      { name: "（例）ほのおのいぶき", effect: "敵単体に炎属性ダメージを与える" },
    ];

    const passiveSkillData = [
      { name: "（例）こんじょう", effect: "HPが1/4以下のとき防御力が上昇する" },
    ];

    const rewardLvInfo = {
      note: "情報を集めています。わかり次第このセクションに追加します。",
    };

    // ==========================================================
    // ここから下は表示用のロジックです（通常は編集不要）
    // ==========================================================

    function renderEvents(list) {
      const container = document.getElementById('eventList');
      const emptyNote = document.getElementById('eventEmpty');
      container.innerHTML = '';
      if (list.length === 0) {
        emptyNote.hidden = false;
        return;
      }
      emptyNote.hidden = true;
      list.forEach((ev) => {
        const card = document.createElement('div');
        card.className = 'event-card';
        const title = document.createElement('h3');
        title.textContent = ev.event;
        card.appendChild(title);
        ev.choices.forEach((c) => {
          const row = document.createElement('div');
          row.className = 'choice-row';
          const text = document.createElement('span');
          text.className = 'choice-text';
          text.textContent = c.text;
          const reward = document.createElement('span');
          reward.className = 'choice-reward';
          reward.textContent = c.reward;
          row.appendChild(text);
          row.appendChild(reward);
          card.appendChild(row);
        });
        container.appendChild(card);
      });
    }

    function filterEvents(query) {
      const q = query.trim().toLowerCase();
      if (!q) return eventData;
      return eventData
        .map((ev) => {
          const matchedChoices = ev.choices.filter(
            (c) =>
              ev.event.toLowerCase().includes(q) ||
              c.text.toLowerCase().includes(q) ||
              c.reward.toLowerCase().includes(q)
          );
          return matchedChoices.length ? { event: ev.event, choices: matchedChoices } : null;
        })
        .filter(Boolean);
    }

    document.getElementById('eventSearch').addEventListener('input', (e) => {
      renderEvents(filterEvents(e.target.value));
    });

    function renderCardGrid(containerId, data) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      data.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'data-card';
        const name = document.createElement('p');
        name.className = 'card-name';
        name.textContent = item.name;
        const effect = document.createElement('p');
        effect.className = 'card-effect';
        effect.textContent = item.effect;
        card.appendChild(name);
        card.appendChild(effect);
        container.appendChild(card);
      });
    }

    function renderStatusNote(elementId, info) {
      document.getElementById(elementId).textContent = info.note;
    }

    function renderBlessing() {
      document.getElementById('blessingDesc').textContent = blessingInfo.description;
      const table = document.getElementById('blessingTable');
      table.innerHTML = '';
      blessingInfo.levels.forEach((lv) => {
        const row = document.createElement('div');
        row.className = 'level-row';
        row.innerHTML =
          '<div class="lv-badge">Lv.' + lv.level + '</div>' +
          '<div><span class="lv-label">効果</span>' + lv.effect + '</div>' +
          '<div><span class="lv-label">条件</span>' + lv.condition + '</div>';
        table.appendChild(row);
      });
    }

    renderEvents(eventData);
    renderCardGrid('itemGrid', itemData);
    renderCardGrid('playGrid', playData);
    renderStatusNote('trainingStatus', trainingInfo);
    renderBlessing();
    renderCardGrid('battleSkillGrid', battleSkillData);
    renderCardGrid('passiveSkillGrid', passiveSkillData);
    renderStatusNote('rewardLvStatus', rewardLvInfo);

    document.getElementById('lastUpdated').textContent = new Date().toLocaleDateString('ja-JP');
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">

  <meta charset="UTF-8">

			<p id="monsterTarget" class="monster-target-badge"></p>

				<tr>
					<th>🩷HP</th>

			</thead>
			<tbody>
				<tr id="monsterStatValues"></tr>
			</tbody>
		</table>
	</div>

	<div class="sub-page__section">
		<h2>習得可能なスキル</h2>
		<div class="skill-groups" id="monsterSkillGroups"></div>
	</div>
</div>
